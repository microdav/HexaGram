<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f5c518" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HexaGram" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>HexaGram</title>
    <script>
      // Le service worker ne sert QU'EN PRODUCTION. En développement (localhost),
      // il provoquait un cache-first des modules /src/* → bundle périmé malgré le
      // HMR et le hard refresh. Sur localhost on désenregistre tout SW existant et
      // on purge ses caches pour réparer les clients déjà « empoisonnés ».
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var dev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (dev) {
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            rs.forEach(function (r) { r.unregister(); });
          });
          if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
          return;
        }
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
